# dependabot
# Ref: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# ------------------------------------------------------------------------------
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  groups:
    # open a single pull-request for all GitHub actions updates
    github-actions:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /
  schedule:
    interval: monthly
  ignore:
  # stay on the Python minor version of .python-version and uv.lock (3.13);
  # moving to a new one is done by hand
  - dependency-name: python
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
