[project]
name = "dracor-mcp"
version = "1.0.0-beta.2"
description = "DraCor MCP server for interacting with the Drama Corpora Project API v1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp == 4.1.6",
    "requests",
    "pydantic",
    "python-multipart",
    "python-dotenv",
    "lxml"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
