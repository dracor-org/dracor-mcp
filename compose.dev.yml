services:
  dracor-mcp:
    image: "dracor/mcp:dev"
    build:
      context: .
    pull_policy: build
    container_name: dracor-mcp
    environment:
      - DRACOR_API_BASE_URL=https://staging.dracor.org/api/v1
      - DRACOR_EXISTDB_ADMIN=admin
      - DRACOR_EXISTDB_PWD=
      - DRACOR_MCP_TRANSPORT=streamable-http
    ports:
      - "8000:8000"
