services:
  dracor-mcp:
    image: "dracor/mcp:dev"
    build:
      context: .
    pull_policy: build
    container_name: dracor-mcp
    environment:
      - DRACOR_API_BASE_URL=https://staging.dracor.org/api/v1
      - DRACOR_EXISTDB_ADMIN=admin
      - DRACOR_EXISTDB_PWD=
      - DRACOR_MCP_ENABLE_ADMIN_TOOLS=false
      - DRACOR_MCP_TRANSPORT=sse
    ports:
      - "8000:8000"
